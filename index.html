<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jacky's notes, projects, and project documentation." />
    <meta name="theme-color" content="#0f1517" />
    <script>
      (() => {
        const storageKey = "jacky-theme";
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem(storageKey);
        } catch (error) {
          console.warn("Theme preference is unavailable.", error);
        }

        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f6f4ec" : "#0f1517";
      })();
    </script>
    <title>Jacky — Notes from the workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
